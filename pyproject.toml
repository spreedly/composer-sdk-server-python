[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spreedly-composer-sdk-server"
version = "1.0.0"
description = "Composer Server SDK for Python"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD-PARTY-LICENSES"]
authors = [
    {name = "Spreedly", email = "support@spreedly.com"}
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "requests>=2.32.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.21.0",
    "responses>=0.23.0",
    # Pinned exactly so a linter release never fails an unrelated PR.
    # Bump deliberately; Dependabot proposes these weekly.
    "ruff==0.16.10",
    "mypy==2.3.1",
    "types-requests>=2.28.0",
]

[project.urls]
Homepage = "https://spreedly.com"
Documentation = "https://developer.spreedly.com"
Repository = "https://github.com/spreedly/composer-sdk-server-python"

[tool.setuptools.packages.find]
where = ["."]
include = ["composer*"]

[tool.setuptools.package-data]
composer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=composer --cov-report=term-missing --cov-report=html --cov-report=xml"

[tool.coverage.run]
source = ["composer"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
